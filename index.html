<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZHAVAN உழவன் — every farmer's satellite</title>
<meta name="description" content="Crop-rotation advice for a village, built on open NASA data. Tamil and English.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316251c'/%3E%3Cpath d='M16 26V13M16 17c-5 0-7-3-7-7 5 0 7 3 7 7zm0-3c0-4 2-7 7-7 0 4-2 7-7 7z' fill='none' stroke='%23e0a100' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --wash:#FBF0C4;      /* turmeric-washed cloth */
  --paper:#FFFCF0;
  --ink:#16261D;       /* wet-leaf black */
  --ink2:#4A5A50;
  --leaf:#1F6B3A;
  --kumkum:#B4232A;
  --manjal:#E2A300;    /* turmeric */
  --rain:#2C6FA8;
  --line:#DCCB8E;
  --font:"Anek Tamil","Nirmala UI","Latha","Noto Sans Tamil",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;padding-bottom:128px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rain);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:1.55rem;font-weight:750;font-stretch:112%}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2);font-size:.9rem}

/* top band */
.band{background:var(--ink);color:#FFF8DC;
  background-image:radial-gradient(circle,#ffffff2b 1.6px,transparent 2px);background-size:22px 22px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:120%;font-size:1.25rem;letter-spacing:.01em}
.brand span{color:var(--manjal)}
.grow{flex:1}
.lang{display:flex;border:1.5px solid #FFF8DC66;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 14px;cursor:pointer;color:#FFF8DC}
.lang button[aria-pressed=true]{background:var(--manjal);color:var(--ink);font-weight:700}
.status{font-size:.82rem;padding:4px 10px;border-radius:999px;background:#ffffff1c}
.status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#6EE7A0;margin-right:6px}
.status.saved::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--manjal);margin-right:6px}
.hero{padding:26px 0 30px;display:grid;gap:22px}
.hero h1{font-size:clamp(2.1rem,5vw,3.7rem);font-weight:800;font-stretch:118%;line-height:1.08}
.hero p.lead{max-width:56ch;font-size:1.08rem;color:#FFF8DCd9;margin-top:10px}
.villages{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.villages button{background:#FFF8DC14;border:1.5px solid #FFF8DC55;color:#FFF8DC;border-radius:14px;padding:10px 14px;text-align:left;cursor:pointer;min-width:150px}
.villages button b{display:block;font-size:1.05rem}
.villages button small{opacity:.8}
.villages button[aria-pressed=true]{background:var(--manjal);border-color:var(--manjal);color:var(--ink)}
#map{height:270px;border-radius:14px;overflow:hidden;background:#0d1a13;border:1.5px solid #FFF8DC33}
.more{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:.92rem;color:#FFF8DCd9}
.more select{font:inherit;padding:8px 12px;border-radius:10px;border:1.5px solid #FFF8DC55;background:#22352a;color:#FFF8DC;min-width:210px;max-width:100%}
.mapnote{font-size:.82rem;color:#FFF8DCb0;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mapnote label{display:flex;gap:6px;align-items:center;cursor:pointer}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr;align-items:end}#map{height:310px}}

section.block{padding:30px 0 6px}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.src{font-size:.82rem;color:var(--ink2)}
.src a{color:inherit}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.two{display:grid;gap:16px}
@media(min-width:900px){.two{grid-template-columns:1.6fr 1fr}}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;margin-top:8px;color:var(--ink2)}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.facts div{border-top:2px solid var(--ink);padding-top:6px}
.facts b{display:block;font-size:1.35rem;font-stretch:112%;line-height:1.1}
.facts span{font-size:.8rem;color:var(--ink2)}

/* soil */
.soilrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.soilrow:last-of-type{border-bottom:0}
.soilrow b{font-size:1.1rem}
.tex{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 4px}
.tex i{display:block}

/* advisor */
.controls{display:grid;gap:14px}
@media(min-width:900px){.controls{grid-template-columns:1fr 1fr 1.6fr;align-items:start}}
.field label{display:block;font-size:.88rem;font-weight:650;margin-bottom:4px}
select{width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.prio{display:grid;gap:8px}
.prio .row{display:grid;grid-template-columns:118px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--leaf)}
.cards{display:grid;gap:14px;margin-top:16px;align-items:start}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.card.first{border-color:var(--leaf);border-width:2.5px}
.card .rank{font-size:.82rem;color:var(--ink2)}
.card .name{font-size:1.5rem;font-weight:760;font-stretch:110%;line-height:1.15}
.card .name small{font-size:.85rem;font-weight:500;color:var(--ink2);display:block}
.score{position:absolute;right:14px;top:12px;text-align:right}
.score b{font-size:2.3rem;font-weight:800;font-stretch:118%;line-height:1}
.score span{font-size:.8rem;color:var(--ink2)}
.ing{margin-top:12px;display:grid;gap:7px}
.ing .r{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;font-size:.85rem}
.track{height:10px;background:#EFE3B4;border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;transition:width .35s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:#EFE3B4}
.chip.bad{background:#F6D5D3;color:#7d1218}
.chip.good{background:#D3EBD9;color:#12491f}
.chip.warn{background:#FCE3A6;color:#6a4a00}
details.math{margin-top:10px;font-size:.84rem}
details.fert,details.prot{margin-top:6px}
a.fsrc{display:inline-block;margin-top:6px;font-size:.82rem}
details.math summary{cursor:pointer;color:var(--leaf);font-weight:650}
details.math pre{white-space:pre-wrap;font-family:inherit;background:#F6ECC6;border-radius:10px;padding:10px;margin:8px 0 0;line-height:1.55}
.stbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stgrid label{font-size:.78rem;font-weight:650;display:block}
.stgrid input{display:block;width:100%;margin-top:3px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.stbtn{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.stbtn button{font:inherit;font-size:.82rem;padding:5px 11px;border-radius:999px;border:1.5px solid var(--leaf);background:transparent;color:var(--leaf);cursor:pointer}
.outlook{margin-top:14px}
.outlook p{margin:6px 0 0}
.outlook .months{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.outlook .months button{font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1.5px solid var(--leaf);background:transparent;color:var(--leaf);cursor:pointer}
.outlook .months button:hover,.outlook .months button:focus-visible{background:var(--leaf);color:#fff}
.rest{margin-top:14px}
.rest table{width:100%;border-collapse:collapse;font-size:.9rem}
.rest td,.rest th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.rest td.n,.rest th.n{text-align:right;font-variant-numeric:tabular-nums}

/* chat */
.chat{display:grid;gap:10px}
.log{min-height:120px;max-height:380px;overflow:auto;display:grid;gap:8px;align-content:start}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap}
.msg.q{justify-self:end;background:var(--ink);color:#FFF8DC;border-bottom-right-radius:4px}
.msg.a{background:#F1E6B8;border-bottom-left-radius:4px}
.msg .tag{display:block;font-size:.74rem;color:var(--ink2);margin-top:6px}
.ask{display:flex;gap:8px}
.ask input{flex:1;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;min-width:0}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--leaf);border:1.5px solid var(--leaf)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.aiset{font-size:.85rem}
.aiset summary{cursor:pointer;color:var(--ink2)}
.aiset .ask{margin-top:8px}

/* proof */
.tests{display:grid;gap:8px}
.test{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;font-size:.92rem;padding:8px 0;border-bottom:1px dashed var(--line)}
.test:last-child{border-bottom:0}
.ok{color:var(--leaf);font-weight:800}.no{color:var(--kumkum);font-weight:800}
ul.data{margin:0;padding-left:18px;font-size:.92rem}
ul.data li{margin:5px 0}
ul.data a{color:var(--leaf)}

/* time machine */
.tm{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#FFF8DC;z-index:1000;border-top:3px solid var(--manjal)}
.tm .in{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;padding:10px 16px 12px}
.tm .yr{font-size:2.4rem;font-weight:800;font-stretch:122%;line-height:1;color:var(--manjal);font-variant-numeric:tabular-nums;min-width:4.6ch}
.tm .lab{font-size:.8rem;opacity:.85}
.tm input[type=range]{accent-color:var(--manjal);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:.74rem;opacity:.8;position:relative;height:1.1em}
.ticks span{position:absolute;transform:translateX(-50%)}
.tm .delta{grid-column:1/-1;font-size:.82rem;opacity:.92}
.tm .delta b{color:var(--manjal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<div class="band">
  <div class="wrap">
    <div class="bar">
      <div class="brand">உழவன் <span>UZHAVAN</span></div>
      <div class="grow"></div>
      <span id="status" class="status saved"></span>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-ta" aria-pressed="true">தமிழ்</button>
        <button id="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="hero">
      <div>
        <h1 data-t="hero"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="villages" id="villages"></div>
  <div class="more"><label for="erodeSel" id="erodeLab"></label><select id="erodeSel"></select></div>
      </div>
      <div>
        <div id="map"></div>
        <div class="mapnote">
          <label><input type="checkbox" id="ndvi" checked> <span data-t="ndvi"></span></label>
          <span data-t="mapnote"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="block wrap" id="dash">
  <div class="sechead"><h2 id="dashTitle"></h2><span class="src" id="dashSrc"></span></div>
  <div class="two">
    <div class="panel chart">
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="panel" id="soil"></div>
  </div>
</section>

<section class="block wrap" id="advisor">
  <div class="sechead"><h2 data-t="advTitle"></h2><span class="src" data-t="advSrc"></span></div>
  <div class="panel controls">
    <div class="field"><label for="sow" data-t="sowLabel"></label><select id="sow"></select></div>
    <div class="field"><label for="prev" data-t="prevLabel"></label><select id="prev"></select></div>
    <div class="field">
      <label data-t="prioLabel"></label>
      <div class="prio">
        <div class="row"><span data-t="wWater"></span><input type="range" id="w-water" min="0" max="10" value="5" aria-label="Save water"><b id="p-water"></b></div>
        <div class="row"><span data-t="wSoil"></span><input type="range" id="w-soil" min="0" max="10" value="5" aria-label="Soil health"><b id="p-soil"></b></div>
        <div class="row"><span data-t="wProfit"></span><input type="range" id="w-profit" min="0" max="10" value="5" aria-label="Profit"><b id="p-profit"></b></div>
      </div>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panel outlook" id="outlook" hidden></div>
  <div class="panel rest" id="rest"></div>
</section>

<section class="block wrap" id="chatsec">
  <div class="sechead"><h2 data-t="chatTitle"></h2><span class="src" data-t="chatSrc"></span></div>
  <div class="panel chat">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="sugg" id="sugg"></div>
    <form class="ask" id="askform">
      <input id="q" autocomplete="off">
      <button class="btn" data-t="askBtn"></button>
    </form>
    <details class="aiset">
      <summary data-t="aiSummary"></summary>
      <p class="muted" data-t="aiNote" style="margin-top:6px"></p>
      <div class="ask">
        <input id="aikey" type="password" autocomplete="off" placeholder="sk-ant-…">
        <button class="btn ghost" id="aisave" type="button" data-t="aiSave"></button>
      </div>
      <p class="muted" id="aistate" style="margin-top:6px"></p>
    </details>
  </div>
</section>

<section class="block wrap" id="proof">
  <div class="sechead"><h2 data-t="proofTitle"></h2></div>
  <div class="two">
    <div class="panel">
      <h3 data-t="testsTitle"></h3>
      <p class="muted" data-t="testsNote" style="margin:4px 0 8px"></p>
      <div class="tests" id="tests"></div>
    </div>
    <div class="panel">
      <h3 data-t="dataTitle"></h3>
      <ul class="data" id="datalist"></ul>
    </div>
  </div>
</section>

<div class="tm" role="region" aria-label="Climate Time Machine">
  <div class="wrap in">
    <div><div class="lab" data-t="tmLabel"></div><div class="yr" id="yr">2026</div></div>
    <div>
      <input type="range" id="year" min="2026" max="2050" step="1" value="2026" aria-label="Year">
      <div class="ticks"><span style="left:16.67%">2030</span><span style="left:58.33%">2040</span><span style="left:100%;transform:translateX(-100%)">2050</span></div>
    </div>
    <div class="delta" id="delta"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ============================================================

   ============================================================ */
const DAYS=[31,28.25,31,30,31,30,31,31,30,31,30,31];
const MKEY=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

           ta:["ஜன","பிப்","மார்","ஏப்","மே","ஜூன்","ஜூலை","ஆக","செப்","அக்","நவ","டிச"]};
const MONL={en:["January","February","March","April","May","June","July","August","September","October","November","December"],
            ta:["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"]};

  note:{en:"Mediterranean; irrigated",ta:"மத்தியதரைக் காலநிலை; பாசன விவசாயம்"},

  prev:"millet"}
};
/* More places in Erode district. Coordinates: OpenStreetMap; climate and soil fetched like the pilots.

const S={st:(()=>{try{return JSON.parse(localStorage.getItem("uzhavan_soiltest"))||{}}catch(e){return {}}})(),lang:"ta",vid:"vellode",year:2026,sow:new Date().getMonth(),prev:"paddy",
  w:{water:5,soil:5,profit:5},live:false,soilLive:false,period:SAVED_PERIOD,custom:null};
const $=id=>document.getElementById(id);
const t=k=>TX[S.lang][k];
const cn=id=>CROPS[id][S.lang];
function village(){
  if(S.vid==="custom")return S.custom;
  const v=VILLAGES[S.vid];
  if(!v.rain)v.rain=v.p.map((x,i)=>x*DAYS[i]*(v.rr?v.rr[i]:1));
  return v;
}
function regionId(){return S.vid==="custom"?S.custom.region:(VILLAGES[S.vid].region||S.vid)}

/* ============================================================
   CLIMATE + SCORING ENGINE
   ============================================================ */
if(NEX&&NEX.vellode&&!NEX.c45_310)NEX.c45_310=NEX.vellode;
/* a village uses its own NEX series, else its grid cell's, else (flagged as borrowed) its region pilot's */
function nexKey(v){ if(!NEX)return null; for(const k in VILLAGES)if(VILLAGES[k]===v){ if(NEX[k])return k; if(v.cell&&NEX[v.cell])return v.cell; if(v.region&&NEX[v.region])return v.region; return null } return null }
function nexFor(v){const k=nexKey(v);return k?NEX[k]:null}
function nexBorrowKm(v){ const k=nexKey(v); if(!k||!v.region||k!==v.region)return 0; const r=VILLAGES[v.region]; return Math.round(111*Math.hypot(v.lat-r.lat,(v.lon-r.lon)*Math.cos(v.lat*Math.PI/180))) }
/* NASA POWER is on a grid of about 0.5 x 0.625 degrees: places in one cell share the same rain and temperature */
function powerMates(v){ if(!v||!v.p)return []; const key=x=>x.p.map(y=>(+y).toFixed(2)).join(","), me=key(v); return Object.keys(VILLAGES).filter(k=>VILLAGES[k]!==v&&key(VILLAGES[k])===me) }
function climate(v,year){
  const a=nexFor(v), Y=[2026,2030,2040,2050];
  if(!a||year<=2026)return {rain:v.rain.slice(),t:v.t.slice(),dT:0,dR:0,has:!!a};
  let i=1; while(i<3&&year>Y[i])i++;
  const f=(year-Y[i-1])/(Y[i]-Y[i-1]);
  const mix=(k,m)=>{const p=i===1?(k==="dT"?0:1):a[k][i-2][m], q=a[k][i-1][m];return p+(q-p)*f};
  const rain=v.rain.map((r,m)=>r*mix("rR",m)), t=v.t.map((x,m)=>x+mix("dT",m));
  const sum=x=>x.reduce((p,q)=>p+q,0);
  return {rain,t,dT:sum(t)/12-sum(v.t)/12,dR:sum(rain)/sum(v.rain)-1,has:true};
}
function windowMonths(sow,dur){const a=[];for(let i=0;i<dur;i++)a.push((sow+i)%12);return a}
function scoreCrop(id,margin,irr,clim,sow,prev,w){
  const c=CROPS[id], ms=windowMonths(sow,c.dur);
  const rain=ms.reduce((s,m)=>s+clim.rain[m],0), eff=USABLE*rain;
  const topup=irr?TOPUP*c.need:0;
  const wf=Math.min(1,(eff+topup)/c.need);
  const profit=margin/5, soil=c.soil;
  let ws=w.water+w.soil+w.profit, ww=w;
  if(ws<=0){ww={water:1,soil:1,profit:1};ws=3}
  const base=(ww.water*wf+ww.soil*soil+ww.profit*profit)/ws;
  const seasonT=ms.reduce((a,m)=>a+clim.t[m],0)/ms.length, hotT=seasonT, coldT=seasonT; // mean temperature over the months in the field
  const heat=Math.max(0,Math.min(1,(hotT-c.oHi)/(c.aHi-c.oHi)));
  const cold=Math.max(0,Math.min(1,(c.oLo-coldT)/(c.oLo-c.aLo)));
  const stress=Math.max(heat,cold);
  const pc=prev?CROPS[prev]:null;
  const rot=pc&&pc.fam===c.fam?ROT_PEN:0;
  const bonus=pc&&pc.exh&&c.leg?LEG_BONUS:0;
  const raw=100*base*(1-HEAT_K*stress)-rot+bonus;
  const score=Math.max(0,Math.min(100,Math.round(raw)));
  return {id,score,raw,wf,soil,profit,base,heat,cold,stress,hotT,coldT,rot,bonus,rain,eff,topup,irr:!!irr,ms,
          share:{water:ww.water/ws,soil:ww.soil/ws,profit:ww.profit/ws}};
}
function rankAll(year=S.year,sow=S.sow,prev=S.prev,w=S.w,vid){
  const v=vid?VILLAGES[vid]:village(); if(vid&&!v.rain)v.rain=v.p.map((x,i)=>x*DAYS[i]*(v.rr?v.rr[i]:1));
  const clim=climate(v,year);
  return REGION[vid?(VILLAGES[vid].region||vid):regionId()].map(([id,m,irr,ps,is])=>Object.assign(scoreCrop(id,m,irr,clim,sow,prev,w),{margin:m,ps:ps||"",is:is||""}))
    .sort((a,b)=>b.score-a.score||b.raw-a.raw);
}

   LIVE DATA (each fetch has a fallback)
   ============================================================ */
async function getJSON(url,ms=9000){
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal}); if(!r.ok)throw new Error(r.status); return await r.json()}
  finally{clearTimeout(to)}
}
async function fetchPower(lat,lon){
  const d=await getJSON(`https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=T2M,T2M_MAX,PRECTOTCORR&community=AG&longitude=${lon}&latitude=${lat}&format=JSON`);
  const P=d.properties.parameter, get=k=>MKEY.map(m=>P[k][m]);
  const p=get("PRECTOTCORR"), tt=get("T2M"), tx=get("T2M_MAX");
  if([...p,...tt].some(x=>x==null||x<-900))throw new Error("fill");
  const m=/(\d{4})\D+(\d{4})/.exec((d.header&&d.header.range)||"");
  return {p,t:tt,tx,rain:p.map((x,i)=>x*DAYS[i]),period:m?`${m[1]}–${m[2]}`:SAVED_PERIOD};
}
async function fetchSoil(lat,lon){
  const d=await getJSON(`https://rest.isric.org/soilgrids/v2.0/properties/query?lon=${lon}&lat=${lat}&property=clay&property=sand&property=silt&property=phh2o&property=soc&depth=0-5cm&value=mean`,12000);
  const o={}; d.properties.layers.forEach(L=>o[L.name]=L.depths[0].values.mean);
  if(o.clay==null)return null;
  return {lat,lon,clay:o.clay/10,sand:o.sand/10,silt:o.silt/10,ph:o.phh2o/10,soc:o.soc/10};
}
async function refreshLive(){
  const id=S.vid; if(id==="custom")return;
  const v=VILLAGES[id];
  S.live=!!v._live; S.soilLive=!!v._soilLive; S.period=v._period||SAVED_PERIOD;
  if(!v._live){
    fetchPower(v.lat,v.lon).then(d=>{Object.assign(v,{p:d.p,t:d.t,tx:d.tx,rain:d.rain.map((x,i)=>x*(v.rr?v.rr[i]:1)),_live:true,_period:d.period});
      if(S.vid===id){S.live=true;S.period=d.period;renderAll()}}).catch(()=>{});
  }
  if(!v._soilLive){
    fetchSoil((v.soil||v).lat,(v.soil||v).lon).then(s=>{if(!s)return;v.soil=s;v._soilLive=true;
      if(S.vid===id){S.soilLive=true;renderSoil()}}).catch(()=>{});
  }
}
function nearestPilot(lat,lon){
  let best="vellode",bd=1e9;
  for(const k in VILLAGES){const v=VILLAGES[k];const d=Math.hypot(v.lat-lat,(v.lon-lon)*Math.cos(lat*Math.PI/180));if(d<bd){bd=d;best=k}}
  return VILLAGES[best].region||best;
}
async function loadCustom(lat,lon){
  lat=+lat.toFixed(2);lon=+lon.toFixed(2);
  $("status").textContent=t("loading");
  try{
    const d=await fetchPower(lat,lon), region=nearestPilot(lat,lon);
    S.custom={lat,lon,region,name:{en:`${lat}, ${lon}`,ta:`${lat}, ${lon}`},place:{en:TX.en.custom,ta:TX.ta.custom},
      p:d.p,t:d.t,tx:d.tx,rain:d.rain,soil:null};
    S.vid="custom";S.live=true;S.soilLive=false;S.period=d.period;
    S.prev=VILLAGES[region].prev;
    renderAll();
    fetchSoil(lat,lon).then(s=>{if(s&&S.vid==="custom"&&S.custom.lat===lat){S.custom.soil=s;S.soilLive=true;renderSoil()}}).catch(()=>{});
  }catch(e){ $("status").textContent=t("failCustom"); }
}

function renderChart(){
  const v=village(), c=climate(v,S.year), fut=S.year>2026;
  const W=640,H=300,L=44,R=44,T=14,B=30,pw=W-L-R,ph=H-T-B;
  const maxR=Math.max(60,...c.rain,...v.rain)*1.12;
  const allT=[...c.t,...v.t], tmin=Math.floor(Math.min(...allT)-2), tmax=Math.ceil(Math.max(...allT)+2);
  const bw=pw/12, x=i=>L+i*bw, yR=r=>T+ph-(r/maxR)*ph, yT=tt=>T+ph-((tt-tmin)/(tmax-tmin))*ph;

    const tv=tmin+(tmax-tmin)*g/4; s+=`<text x="${W-R+6}" y="${y+4}" font-size="11" fill="#B4232A">${fmt(tv,0)}°</text>`}
  for(let i=0;i<12;i++){
    const inWin=false;
    if(fut){const yb=yR(v.rain[i]); s+=`<rect x="${x(i)+6}" y="${yb}" width="${bw-12}" height="${T+ph-yb}" fill="none" stroke="#2C6FA8" stroke-dasharray="3 3" stroke-width="1.2"/>`}
    const y=yR(c.rain[i]);
    s+=`<rect x="${x(i)+6}" y="${y}" width="${bw-12}" height="${T+ph-y}" rx="3" fill="#2C6FA8" opacity="${fut?.8:1}"><title>${MONL[S.lang][i]}: ${Math.round(c.rain[i])} mm, ${fmt(c.t[i],1)} °C</title></rect>`;
    s+=`<text x="${x(i)+bw/2}" y="${y-4}" font-size="10.5" text-anchor="middle" fill="#16261D">${Math.round(c.rain[i])}</text>`;
    s+=`<text x="${x(i)+bw/2}" y="${H-10}" font-size="12" text-anchor="middle" fill="#16261D">${MON[S.lang][i]}</text>`;
  }
  const path=a=>a.map((tt,i)=>`${i?"L":"M"}${x(i)+bw/2},${yT(tt)}`).join(" ");
  if(fut)s+=`<path d="${path(v.t)}" fill="none" stroke="#B4232A" stroke-width="1.6" stroke-dasharray="5 4" opacity=".7"/>`;
  s+=`<path d="${path(c.t)}" fill="none" stroke="#B4232A" stroke-width="3" stroke-linejoin="round"/>`;
  c.t.forEach((tt,i)=>s+=`<circle cx="${x(i)+bw/2}" cy="${yT(tt)}" r="3.4" fill="#FFFCF0" stroke="#B4232A" stroke-width="2"/>`);
  s+=`</svg>`;
  $("chart").innerHTML=s;
  $("legend").innerHTML=`<span><i class="sw" style="background:#2C6FA8"></i>${t("rain")}</span><span><i class="sw" style="background:#B4232A;height:3px"></i>${t("temp")}</span>`+(fut?`<span><i class="sw" style="border:1.2px dashed #2C6FA8;background:none"></i>${t("base")}</span>`:"");
  const ann=c.rain.reduce((a,b)=>a+b,0), wet=c.rain.indexOf(Math.max(...c.rain)), hot=c.t.indexOf(Math.max(...c.t));
  $("facts").innerHTML=`<div><b>${Math.round(ann)} mm</b><span>${t("fAnn")}</span></div><div><b>${MONL[S.lang][wet]}</b><span>${t("fWet")}, ${Math.round(c.rain[wet])} mm</span></div><div><b>${fmt(c.t[hot],1)} °C</b><span>${t("fHot")}, ${MONL[S.lang][hot]}</span></div>`;

    extra=Lt?`. மழை: NASA POWER கட்ட மதிப்பு, NASA GPM IMERG (10 கி.மீ செயற்கைக்கோள் மழை) கொண்டு இந்த இடத்துக்கு மாற்றப்பட்டது (ஆண்டுக்கு ${pc>=0?"+":""}${pc}%). வெப்பநிலை: சுமார் 50 கி.மீ NASA கட்டம்${pm?`, மேலும் ${pm} ஊர்களுடன் பொது`:""}`
            :`. Rain: the NASA POWER cell value, adjusted to this spot with NASA GPM IMERG 10 km satellite rainfall (${pc>=0?"+":""}${pc}% over the year). Temperature: the 50 km NASA cell${pm?`, shared with ${pm} other places here`:""}`; }
  else if(pm) extra=Lt?`. NASA வானிலைக் கட்டம் சுமார் 50 கி.மீ அகலம்; இங்குள்ள மேலும் ${pm} ஊர்கள் இதே கட்டத்தில் உள்ளன`:`. The NASA weather grid is about 50 km wide; ${pm} other places here are in the same cell`;

function texture(sa,si,cl){
  if(cl>=40)return sa>45?"sandy clay":si>=40?"silty clay":"clay";
  if(cl>=27)return sa<=20?"silty clay loam":sa>45?"sandy clay loam":"clay loam";
  if(cl>=20&&sa>45)return "sandy clay loam";
  if(si>=50)return "silt loam";
  if(sa>=85)return "sand"; if(sa>=70)return "loamy sand"; if(sa>=52)return "sandy loam";
  return "loam";
}
function soilWords(s){

function outlook(){
  const months=[], top=(y,m)=>rankAll(y,m).slice(0,3).map(r=>r.id).join(",");
  for(let m=0;m<12;m++)if(top(2026,m)!==top(2050,m))months.push(m);
  const a=rankAll(2026,S.sow), b=rankAll(2050,S.sow), now={}; a.forEach(r=>now[r.id]=r.score);
  const moves=b.map(r=>({id:r.id,d:r.score-now[r.id]})).sort((x,y)=>x.d-y.d);
  return {months,same:!months.includes(S.sow),lose:moves[0],gain:moves[moves.length-1],t3:b.slice(0,3).map(r=>r.score-now[r.id])};

   MAP (Leaflet + NASA GIBS; falls back to plain panel)
   ============================================================ */
let map=null,ndviLayer=null,marks={},customMark=null;
function initMap(){
  if(!window.L){$("map").style.display="none";document.querySelector(".mapnote").style.display="none";return}
  map=L.map("map",{scrollWheelZoom:false,worldCopyJump:true}).setView([11.34,77.72],8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,attribution:"© OpenStreetMap"}).addTo(map);
  ndviLayer=L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_NDVI_8Day/default/default/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png",
    {maxNativeZoom:9,maxZoom:12,opacity:.72,attribution:"NASA GIBS MODIS NDVI"}).addTo(map);
  for(const k in VILLAGES){const v=VILLAGES[k];
    marks[k]=L.circleMarker([v.lat,v.lon],{radius:v.region?6:9,color:"#16261D",weight:2,fillColor:"#E2A300",fillOpacity:1}).addTo(map)
      .on("click",e=>{L.DomEvent.stopPropagation(e);pick(k)});}
  map.on("click",e=>loadCustom(e.latlng.lat,e.latlng.lng));
  $("ndvi").onchange=e=>{e.target.checked?ndviLayer.addTo(map):map.removeLayer(ndviLayer)};
}
function syncMap(){
  if(!map)return;
  const v=village();
  for(const k in marks)marks[k].setStyle({fillColor:k===S.vid?"#B4232A":"#E2A300"}).bindTooltip(VILLAGES[k].name[S.lang]);
  if(customMark){map.removeLayer(customMark);customMark=null}
  if(S.vid==="custom")customMark=L.circleMarker([v.lat,v.lon],{radius:9,color:"#16261D",weight:2,fillColor:"#B4232A",fillOpacity:1}).addTo(map);
  if(syncMap.last!==S.vid+v.lat){syncMap.last=S.vid+v.lat;map.flyTo([v.lat,v.lon],S.vid==="custom"?map.getZoom():(v.region?9:8),{duration:.8})}
}
function pick(k){
  S.vid=k; if(k!=="custom")S.prev=VILLAGES[k].prev; else {S.live=true;S.soilLive=!!S.custom.soil}
  refreshLive(); renderAll();
}

function findCrop(q){
  const s=q.toLowerCase(); const ids=REGION[regionId()].map(r=>r[0]);
  // longest alias wins (so "மக்காச்சோளம்" is maize, not sorghum); a crop grown in this village beats one that is not
  let hit=null, best=-1;
  for(const id in CROPS)for(const a of CROPS[id].al){
    if(!(/^[a-z ]+$/.test(a)?new RegExp("\\b"+a).test(s):s.includes(a)))continue;
    const sc=(ids.includes(id)?1000:0)+a.length; if(sc>best){best=sc;hit=id}
  }
  return hit;
}
function findMonth(q){
  const s=q.toLowerCase();
  for(let i=0;i<12;i++){ if((i===4?/\b(in|during|by|of)\s+may\b/.test(s):new RegExp("\\b"+MONL.en[i].toLowerCase()+"\\b").test(s))||q.includes(MONL.ta[i]))return i }
  for(let i=0;i<12;i++){ if(i!==4&&new RegExp("\\b"+MON.en[i].toLowerCase()+"\\b").test(s))return i }
  if(/this month|\bnow\b|today|இந்த மாத|இப்போ|இன்று/.test(s))return new Date().getMonth();
  return null;
}

  const s=q.toLowerCase(), crop=findCrop(q), mon=findMonth(q);

    if(!ids.includes(crop))return (ta?`${nm}-க்கான பயிர்ப் பட்டியலில் ${N(crop)} இல்லை; அதனால் அதற்கு மதிப்பெண் தர இயலாது. பட்டியலில் உள்ளவை: ${ids.map(N).join(", ")}.`:`${N(crop)} is not in the crop table for ${nm}, so I cannot score it. I can score: ${ids.map(N).join(", ")}.`);
    const m=mon==null?S.sow:mon, all=rankAll(yr,m), r=all.find(x=>x.id===crop), c=CROPS[crop], best=all[0];
    let a;
    if(ta){
      a=(r.score>=65?`ஆம். ${nm}-இல் ${M[m]} மாதம் ${N(crop)} விதைக்கலாம்`:r.score>=45?`கவனத்துடன் விதைக்கலாம். ${nm}-இல் ${M[m]} மாதம் ${N(crop)}`:`பரிந்துரைக்கவில்லை. ${nm}-இல் ${M[m]} மாதம் ${N(crop)}`)+`: மதிப்பெண் ${r.score}/100${yrNote}.`;
      a+=`\nபயிர்க் காலத்தில் (${MON.ta[r.ms[0]]}–${MON.ta[r.ms[r.ms.length-1]]}) பயன்படும் மழை ${Math.round(r.eff)} மி.மீ; தேவை ${c.need} மி.மீ. நீர் பொருத்தம் ${fmt(r.wf,2)}.`;
      if(r.irr)a+=` மீதிக்குக் கால்வாய் அல்லது கிணற்றுப் பாசனம் உறுதியாக இருக்க வேண்டும்.`;
      if(r.heat>0)a+=`\nவெப்ப அபாயம் ${pct(r.heat)}%: பயிர்க் கால சராசரி வெப்பநிலை ${fmt(r.hotT,1)} °C, உகந்த வரம்பு ${c.oHi} °C வரை.`;
      if(r.cold>0)a+=`\nகுளிர் அபாயம் ${pct(r.cold)}%: பயிர்க் கால சராசரி வெப்பநிலை ${fmt(r.coldT,1)} °C, உகந்த வரம்பு ${c.oLo} °C முதல்.`;
      if(r.rot)a+=`\n${N(S.prev)}-க்குப் பிறகு அதே குடும்பப் பயிர்; சுழற்சி அபராதம் −50.`;
      if(r.bonus)a+=`\n${N(S.prev)}-க்குப் பிறகு பயறு வகை மண்ணுக்கு நல்லது: +8.`;
      if(best.id!==crop)a+=`\nஇந்த மாதத்துக்கு முதல் தேர்வு: ${N(best.id)} (${best.score}/100).`;
    }else{
      a=(r.score>=65?`Yes. ${N(crop)} sown in ${M[m]} at ${nm} is a good fit`:r.score>=45?`Possible, with care. ${N(crop)} sown in ${M[m]} at ${nm}`:`Not advised. ${N(crop)} sown in ${M[m]} at ${nm}`)+`: score ${r.score}/100${yrNote}.`;
      a+=`\nUsable rain over its season (${MON.en[r.ms[0]]}–${MON.en[r.ms[r.ms.length-1]]}) is ${Math.round(r.eff)} mm against a need of ${c.need} mm. Water fit ${fmt(r.wf,2)}.`;
      if(r.irr)a+=` The rest must come from assured canal or well irrigation.`;
      if(r.heat>0)a+=`\nHeat risk ${pct(r.heat)}%: the season averages ${fmt(r.hotT,1)} °C, optimal range ends at ${c.oHi} °C.`;
      if(r.cold>0)a+=`\nCold risk ${pct(r.cold)}%: the season averages ${fmt(r.coldT,1)} °C, optimal range starts at ${c.oLo} °C.`;
      if(r.rot)a+=`\nIt is the same plant family as ${N(S.prev)}, which you just harvested: rotation penalty −50.`;
      if(r.bonus)a+=`\nA legume after ${N(S.prev)} rebuilds the soil: +8.`;
      if(best.id!==crop)a+=`\nTop choice for that month: ${N(best.id)} (${best.score}/100).`;
    }
    return a+src;
  }
  // weeds, pests, diseases
  if(/pest|insect|disease|spray|weed|herbicide|fungicide|பூச்சி|களை|நோய்|மருந்து/.test(s)){
    const id=crop&&ids.includes(crop)?crop:rankAll(yr,mon==null?S.sow:mon)[0].id, m=mon==null?S.sow:mon, lines=protLines(id,m,ta);
    if(!lines)return ta?`${nm}-இல் ${N(id)}-க்குப் பயிர்ப் பாதுகாப்பு அட்டவணை இன்னும் சேர்க்கப்படவில்லை. உங்கள் வேளாண் அலுவலகத்தைக் கேளுங்கள்.`:`No published crop-protection schedule has been loaded for ${N(id)} at ${nm}. Ask the local agricultural office.`;
    return (ta?`${N(id)}, ${M[m]} விதைப்பு (${nm}):\n`:`${N(id)} sown in ${M[m]} at ${nm}:\n`)+lines.join("\n");
  }
  // fertilizer
  if(/fertili[sz]|manure|urea|npk|compost|nutrient|உரம்|உரத்|எரு|யூரியா/.test(s)){
    const id=crop&&ids.includes(crop)?crop:rankAll(yr,mon==null?S.sow:mon)[0].id, FA=fertAdj(fertFor(id)), f=FA.f;
    if(!f)return ta?`${nm}-இல் ${N(id)}-க்கு வெளியிடப்பட்ட உரப் பரிந்துரை கிடைக்கவில்லை. உங்கள் வேளாண் அலுவலகத்தைக் கேளுங்கள்.`:`No published fertilizer recommendation was found for ${N(id)} at ${nm}. Ask the local agricultural office.`;
    const pr=fertProducts(f).map(x=>ta?`${x.name[1]} ${x.ac} கி.கி`:`${x.name[0]} ${x.ac} kg`).join(", ");
    const nv=fnut, org=fertItems(f.org).concat(fertItems(f.bio)).join("; ");
    return (ta?`${N(id)}-க்கு உரம் (${nm}): தழை ${nv(f.n)} : மணி ${nv(f.p)} : சாம்பல் ${nv(f.k)} கி.கி/ஹெ.${pr?`\nஏக்கருக்கு: ${pr}.`:""}${org?`\nஇயற்கை, உயிர் உரம்: ${org}.`:""}${f.split?`\nஎப்போது: ${f.split.ta}`:""}\n${FA.adj?stLine(FA.adj,true):"மண் பரிசோதனை இருந்தால் அதன்படி மாற்றுங்கள்."}\nஆதாரம்: ${f.src}.`
      :`Fertilizer for ${N(id)} at ${nm}: N ${nv(f.n)} : P₂O₅ ${nv(f.p)} : K₂O ${nv(f.k)} kg per hectare.${pr?`\nPer acre: ${pr}.`:""}${org?`\nOrganic and biofertilizer: ${org}.`:""}${f.split?`\nWhen: ${f.split.en}`:""}\n${FA.adj?stLine(FA.adj,false):"Adjust to a soil test if you have one."}\nSource: ${f.src}.`);
  }
  // future
  if(/2030|2040|2050|future|climate|எதிர்கால|காலநிலை/.test(s)){
    const y=+(/20[345]0/.exec(s)||[2050])[0], m=mon==null?S.sow:mon, now=rankAll(2026,m), fut=rankAll(y,m), cc=climate(v,y);
    if(!cc.has)return t('deltaNone');
    const line=a=>a.slice(0,3).map(r=>`${N(r.id)} ${r.score}`).join(", ");
    return (ta?`${nm}, ${y}: NASA NEX-GDDP-CMIP6 (SSP2-4.5) சூழலில் வெப்பம் +${fmt(cc.dT,1)} °C, மழை ${cc.dR>=0?'+':''}${Math.round(cc.dR*100)}%.\nஇன்று முதல் மூன்று: ${line(now)}.\n${y}-இல் முதல் மூன்று: ${line(fut)}.\nஇது ஒரு காலநிலைச் சூழல்; வானிலை முன்னறிவிப்பு அல்ல.`
      :`${nm} in ${y}: NASA NEX-GDDP-CMIP6 (SSP2-4.5) adds ${fmt(cc.dT,1)} °C and changes rain by ${cc.dR>=0?'+':''}${Math.round(cc.dR*100)}%.\nTop three today: ${line(now)}.\nTop three in ${y}: ${line(fut)}.\nThis is a climate scenario, not a weather forecast.`)+src;
  }
  // soil
  if(/soil|மண்/.test(s)){
    if(!v.soil)return t("soilNone");
    const so=v.soil, w=soilWords(so);
    return (ta?`${nm} மண்: ${TEXTURE.ta[texture(so.sand,so.silt,so.clay)]} (மணல் ${fmt(so.sand)}%, வண்டல் ${fmt(so.silt)}%, களி ${fmt(so.clay)}%). pH ${fmt(so.ph,1)}, கரிமக் கரி ${fmt(so.soc,1)} g/kg.\nநெல், மஞ்சள், கரும்பு மண் சத்தை அதிகம் எடுக்கும்; அவற்றுக்குப் பின் பயறு வகை போட்டால் மண் வளம் திரும்பும்.`
      :`Soil at ${nm}: ${texture(so.sand,so.silt,so.clay)} (sand ${fmt(so.sand)}%, silt ${fmt(so.silt)}%, clay ${fmt(so.clay)}%). pH ${fmt(so.ph,1)}, organic carbon ${fmt(so.soc,1)} g/kg.\nPaddy, turmeric and sugarcane draw the soil down; a legume after them rebuilds it.`)+(ta?"\nஆதாரம்: ISRIC SoilGrids.":"\nSource: ISRIC SoilGrids.");
  }
  // rain / temperature
  if(/rain|water|monsoon|temperature|heat|hot|மழை|நீர்|வெப்ப|பருவ/.test(s)){
    const c=climate(v,yr), ann=c.rain.reduce((a,b)=>a+b,0), wet=c.rain.indexOf(Math.max(...c.rain)), dry=c.rain.indexOf(Math.min(...c.rain)), hot=c.t.indexOf(Math.max(...c.t));
    return (ta?`${nm}${yrNote}: ஆண்டு மழை ${Math.round(ann)} மி.மீ. அதிக மழை ${M[wet]} (${Math.round(c.rain[wet])} மி.மீ), குறைந்த மழை ${M[dry]} (${Math.round(c.rain[dry])} மி.மீ). அதிக வெப்ப மாதம் ${M[hot]}, சராசரி ${fmt(c.t[hot],1)} °C.`
      :`${nm}${yrNote}: ${Math.round(ann)} mm of rain a year. Wettest month ${M[wet]} (${Math.round(c.rain[wet])} mm), driest ${M[dry]} (${Math.round(c.rain[dry])} mm). Hottest month ${M[hot]}, averaging ${fmt(c.t[hot],1)} °C.`)+src;
  }
  // best crop
  if(/best|grow|sow|plant|crop|next|recommend|cultivat|அடுத்து|போடலாம்|விதை|பயிர்|சாகுபடி|நடலாம்/.test(s)){
    const m=mon==null?S.sow:mon, all=rankAll(yr,m), top=all.slice(0,3);
    const why=r=>ta?`${N(r.id)} ${r.score}/100 (நீர் ${fmt(r.wf,2)}, மண் ${fmt(r.soil,2)}, லாபம் ${fmt(r.profit,2)}${r.bonus?", பயறு ஊக்கம் +8":""}${r.irr?", பாசனம் தேவை":""})`
                      :`${N(r.id)} ${r.score}/100 (water ${fmt(r.wf,2)}, soil ${fmt(r.soil,2)}, profit ${fmt(r.profit,2)}${r.bonus?", legume bonus +8":""}${r.irr?", needs irrigation":""})`;
    return (ta?`${nm}-இல் ${M[m]} மாதம் விதைக்க${S.prev?`, ${N(S.prev)}-க்குப் பிறகு`:""}${yrNote}:\n`:`For sowing in ${M[m]} at ${nm}${S.prev?`, after ${N(S.prev)}`:""}${yrNote}:\n`)
      +top.map((r,i)=>`${i+1}. ${why(r)}`).join("\n")+src;
  }
  return ta?`இந்தக் கிராமத்தின் மழை, வெப்பம், மண், பயிர் மதிப்பெண்கள் பற்றி மட்டுமே என்னால் பதில் சொல்ல முடியும். எடுத்துக்காட்டு: "இந்த மாதம் மஞ்சள் விதைக்கலாமா?"`
           :`I can only answer from this village's rain, temperature, soil and crop scores. Try: "Can I sow turmeric this month?"`;
}
function groundingFacts(){
  const v=village(), c=climate(v,S.year);
  return {village:v.name.en,place:v.place.en,lat:v.lat,lon:v.lon,
    climate_source:`NASA POWER climatology ${S.period}`,scenario_year:S.year,
    scenario_note:S.year>2026?"NASA NEX-GDDP-CMIP6 SSP2-4.5 multi-model mean change applied to the NASA POWER baseline; a scenario, not a forecast":"baseline climate",
    monthly_rain_mm:c.rain.map(x=>Math.round(x)),monthly_mean_temp_c:c.t.map(x=>+x.toFixed(1)),
    soil:v.soil?{source:"ISRIC SoilGrids 0-5cm",texture:texture(v.soil.sand,v.soil.silt,v.soil.clay),sand_pct:v.soil.sand,silt_pct:v.soil.silt,clay_pct:v.soil.clay,ph:v.soil.ph,organic_carbon_g_per_kg:v.soil.soc}:null,
    today_month:MONL.en[new Date().getMonth()],crop_just_harvested:S.prev?CROPS[S.prev].en:"none",
    farmer_priorities:S.w,
    scores_by_sowing_month:MONL.en.map((mn,m)=>({sow_in:mn,crops:rankAll(S.year,m).map(r=>({crop:CROPS[r.id].en,tamil:CROPS[r.id].ta,score:r.score,water_fit:+r.wf.toFixed(2),usable_rain_mm:Math.round(r.eff),need_mm:CROPS[r.id].need,needs_irrigation:r.irr,heat_risk_pct:pct(r.heat),cold_risk_pct:pct(r.cold),rotation_penalty:r.rot,legume_bonus:r.bonus}))}))};
}
async function aiAnswer(q){
  const sys=`You are UZHAVAN, a crop-rotation helper for one farmer. Answer ONLY from the JSON below. Never use outside knowledge for numbers, prices, varieties, pesticides or forecasts. If the answer is not in the JSON, say you cannot answer from this village's data. Reply in the language of the question (Tamil or English), in at most 90 words, plain text, and quote the score and the numbers behind it.\n\nVILLAGE DATA:\n`+JSON.stringify(groundingFacts());
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":aiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-opus-5-5",max_tokens:4000,output_config:{effort:"low"},system:sys,messages:[{role:"user",content:q}]})});
  if(!r.ok){let m=""; try{m=(await r.json()).error.message}catch(e){} throw new Error(r.status+(m?" "+m:""))}
  const d=await r.json(); if(d.stop_reason==="refusal")throw new Error("refusal");
  const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!txt)throw new Error("empty"); return txt;
}
function addMsg(cls,text,tag){
  const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text;
  if(tag){const s=document.createElement("span");s.className="tag";s.textContent=tag;d.appendChild(s)}
  $("log").appendChild(d); $("log").scrollTop=$("log").scrollHeight; return d;
}
async function ask(q){
  q=q.trim(); if(!q)return;
  addMsg("q",q); $("q").value="";
  if(aiKey()){
    const wait=addMsg("a","…");
    try{const a=await aiAnswer(q); wait.remove(); addMsg("a",a,t("tagAI")); return}
    catch(e){wait.remove(); addMsg("a",ruleAnswer(q),t("tagFail")); return}
  }
  addMsg("a",ruleAnswer(q),t("tagRule"));
}

   EVENTS

function setLang(l){S.lang=l;renderStatic();renderAll()}
$("lang-ta").onclick=()=>setLang("ta");
$("lang-en").onclick=()=>setLang("en");
$("villages").onclick=e=>{const b=e.target.closest("button[data-v]"); if(b)pick(b.dataset.v)};
$("erodeSel").onchange=e=>{if(e.target.value)pick(e.target.value)};
$("sow").onchange=e=>{S.sow=+e.target.value;renderAdvisor(true)};
$("prev").onchange=e=>{S.prev=e.target.value;renderAdvisor(true)};
["water","soil","profit"].forEach(k=>$("w-"+k).oninput=e=>{S.w[k]=+e.target.value;renderAdvisor(true)});

  S.sow=+b.dataset.m; $("sow").value=S.sow; S.year=2050; renderChart(); renderAdvisor(true); renderTM();
  $("cards").scrollIntoView({behavior:"smooth",block:"center"})};

  const m={"st-oc":"oc","st-p":"p","st-k":"k"}[e.target.id]; if(!m)return;
  const x=parseFloat(e.target.value); S.st=S.st||{}; S.st[m]=isNaN(x)||x<0?null:x; if(m==="oc")S.st.ocMap=false;
  stSave(); $("st-msg").textContent=stMsg(); renderAdvisor(false);
});
$("soil").addEventListener("click",e=>{
  if(e.target.id==="st-map"){const so=village().soil; if(!so)return; S.st=S.st||{}; S.st.oc=Math.round(so.soc)/10; S.st.ocMap=true}
  else if(e.target.id==="st-clear"){S.st={}}
  else return;
  stSave(); renderSoil(); renderAdvisor(false);
});
$("askform").onsubmit=e=>{e.preventDefault();ask($("q").value)};
$("sugg").onclick=e=>{const b=e.target.closest("button"); if(b)ask(b.textContent)};
$("aisave").onclick=()=>{try{const k=$("aikey").value.trim(); k?localStorage.setItem("uzhavan_ai_key",k):localStorage.removeItem("uzhavan_ai_key")}catch(e){}
  $("aikey").value=""; aiCheck()};
/* after a key is saved, ask one real question so the user sees at once whether the model answers */
async function aiCheck(){
  const st=$("aistate"), L=S.lang==="ta";
  if(!aiKey()){st.textContent=t("aiOff");return}
  st.textContent=L?"AI மாதிரியைச் சோதிக்கிறது…":"Testing the AI model…";
  try{const a=await aiAnswer(L?"இந்த மாதம் முதல் தேர்வு எது?":"What is the top choice this month?");
    st.textContent=(L?"AI மாதிரி வேலை செய்கிறது. சோதனைப் பதில்: ":"AI model works. Test answer: ")+a.slice(0,160)}
  catch(e){st.textContent=(L?"AI மாதிரி பதிலளிக்கவில்லை (":"AI model did not answer (")+String(e.message).slice(0,140)+(L?"). இணையமில்லாப் பதில் இயந்திரம் பயன்படும்.":"). The offline answer engine will be used.")}
}

window.UZ={S,rankAll,scoreCrop,climate,VILLAGES,CROPS,ruleAnswer,FERT,fertFor,fertProducts,PROT,protLines};
initMap(); renderStatic(); renderAll(); refreshLive();
